<article class="product-card">
  <a [routerLink]="['/product', product.id]" class="product-card__link">
    <div class="product-card__image-wrap">
      <img [src]="product.image" [alt]="product.title" loading="lazy" />
      <span class="product-card__badge" *ngIf="product.originalPrice">Sale</span>
    </div>
    <div class="product-card__body">
      <div class="product-card__tags">
        <span>{{ categoryLabels[product.category] }}</span>
        <span>{{ audienceLabels[product.audience] }}</span>
      </div>
      <h3>{{ product.title }}</h3>
      <div class="product-card__rating">
        <span class="stars">★ {{ product.rating }},{{product.attachment}}</span>
        <span class="reviews">({{ product.reviewCount }})</span>
      </div>
      <div class="product-card__price">
        <span class="price">{{ product.basePrice | inr }}</span>
        <span class="original" *ngIf="product.originalPrice">{{ product.originalPrice | inr }}</span>
      </div>
    </div>
  </a>
  <button type="button" class="btn btn--primary btn--sm" [class.btn--success]="added" (click)="addToCart($event)">
    {{ added ? 'Added ✓' : 'Add to Cart' }}
  </button>
</article>
