<div class="max-w-5xl mx-auto p-6 bg-white shadow rounded-lg">
  <h2 class="text-2xl font-bold mb-6">Create Product with Variants</h2>
  
  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-6">
    <!-- Base Info -->
    <div class="grid grid-cols-2 gap-4">
      <div>
        <label class="block font-medium mb-1">Product Title</label>
        <input type="text" formControlName="title" class="w-full border rounded p-2">
      </div>
      <div> <label class="block font-medium mb-1"> Audience </label>
         <select formControlName="audience" class="w-full border rounded p-2 bg-white" >
           <option value=""> Select Audience </option> <option *ngFor="let audience of audienceOptions" [value]="audience" > {{ audience | titlecase }} </option>
           </select> </div> 
           
           <!-- Category --> 
            <div> <label class="block font-medium mb-1"> Category </label> 
            <select formControlName="category" class="w-full border rounded p-2 bg-white" >
               <option value=""> Select Category </option> 
               <option *ngFor="let category of categoryOptions" [value]="category" > {{ category | titlecase }} </option>
               </select> </div>
               
               <!-- Brand --> 
                <div> <label class="block font-medium mb-1"> Brand </label>
                 <input type="text" formControlName="brand" placeholder="Enter brand" class="w-full border rounded p-2" /> </div>
                 
                 <!-- Original Price --> 
                  <div> <label class="block font-medium mb-1"> Original Price </label> <input type="number" formControlName="originalPrice" placeholder="Enter original price" min="0" class="w-full border rounded p-2" /> </div> 
                  
                  <!-- Status -->
                    <div> <label class="block font-medium mb-1"> Status </label> <select formControlName="status" class="w-full border rounded p-2 bg-white" > 
                      <option value=""> Select Status </option> 
                      <option value="draft"> Draft </option>
                       <option value="active"> Active </option>
                       <option value="inactive"> Inactive </option> </select>
                       </div>
      <div>
        <label class="block font-medium mb-1">Default Base Price </label>
        <input type="number" formControlName="basePrice" class="w-full border rounded p-2">
      </div>
    </div>

     <div class="grid grid-cols-12 gap-4">
      <div>
        <label class="block font-medium mb-1">Product Description</label>
        <input type="textarea" formControlName="description" class="w-full border rounded p-2" placeholder="Enter product description" />
      </div>
    
    </div>

    <!-- Attachment -->
<!-- Product Attachment -->

<div class="border-t pt-5">

  <h3 class="text-lg font-semibold mb-3">
    Product Attachment
  </h3>

  <div
    class="border-2 border-dashed border-gray-300
           rounded-lg p-6 text-center"
  >

    <input
      #fileInput
      type="file"
      class="hidden"
      accept=".jpg,.jpeg,.png,.webp"
      (change)="onFileSelected($event)"
    multiple/>

    <div class="text-xs text-gray-500 mt-2">
      JPG, PNG or WEBP · Maximum 1 MB

  </div>

  <button

  [disabled]="productForm.invalid || isSubmitting"
  class="w-full bg-green-600
