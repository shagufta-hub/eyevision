<div class="shop-page">
  <div class="container">
    <header class="shop-header">
      <h1>Shop Eyewear</h1>
      <p>Spectacles, goggles & contact lenses for women, men & kids</p>
    </header>

    <div class="shop-layout">
      <aside class="filters">
        <h3>Filters</h3>

        <label class="filter-group">
          <span>Search</span>
          <input
            type="search"
            [(ngModel)]="filters.search"
            (ngModelChange)="applyFilters()"
            placeholder="Search products..."
          />
        </label>

        <div class="filter-group">
          <span>Category</span>
          <div class="filter-chips">
            <button
              *ngFor="let cat of categories"
              type="button"
              class="chip"
              [class.chip--active]="filters.category === cat"
              (click)="filters.category = cat; applyFilters()"
            >
              {{ getCategoryLabel(cat) }}
            </button>
          </div>
        </div>

        <div class="filter-group">
          <span>For</span>
          <div class="filter-chips">
            <button
              *ngFor="let aud of audiences"
              type="button"
              class="chip"
              [class.chip--active]="filters.audience === aud"
              (click)="filters.audience = aud; applyFilters()"
            >
              {{ getAudienceLabel(aud) }}
            </button>
            <button
  type="button"
  class="btn btn--outline"
  (click)="clearFilters()"
>
  Clear filters
</button>
          </div>
        </div>

        <label class="filter-group">
          <span>Sort by</span>
          <select [(ngModel)]="filters.sort" (ngModelChange)="applyFilters()">
            <option value="featured">Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="rating">Top Rated</option>
          </select>
        </label>
      </aside>

      <section class="shop-results">
        <p class="results-count">{{ products.length }} product{{ products.length !== 1 ? 's' : '' }} found</p>

        <div class="products-grid" *ngIf="products.length; else empty">
          <app-product-card *ngFor="let product of products" [product]="product" />
        </div>

        <ng-template #empty>
          <div class="empty-state">
            <p>No products match your filters.</p>
            <button type="button" class="btn btn--outline" (click)="filters = { category: 'all', audience: 'all', search: '', sort: 'featured' }; applyFilters()">
              Clear filters
            </button>
          </div>
        </ng-template>
      </section>
    </div>
  </div>
</div>
